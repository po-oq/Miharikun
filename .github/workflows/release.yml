name: release

# v* タグを push すると、テスト → 配布 zip の作成 → GitHub Release への添付までを行う。
# 手動実行（Actions タブの Run workflow）では zip を artifact に残すだけで、Release は作らない。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'zip に付けるバージョン（例: 0.1.5）'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: read

jobs:
  build:
    # NativeAOT の発行に必要な C++ ビルドツールと Windows SDK は、このランナーに入っている。
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: バージョンを決める
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = $env:INPUT_VERSION }
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "バージョンの形式が不正です: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: テスト
        run: dotnet test tests/Miharikun.Tests -c Release

      - name: 配布 zip を作る（App は単一ファイル、Hook は NativeAOT）
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: Miharikun-v${{ steps.version.outputs.version }}-win-x64
          path: dist/Miharikun-v${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error

  release:
    # タグを push したときだけ、Release を作って zip を添付する。
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Miharikun-v${{ needs.build.outputs.version }}-win-x64

      # タグを push しただけなら Release を新しく作る。GitHub の画面から（タグと Release を同時に）作った場合は
      # Release が先にあるので、zip だけを追加する。
      - name: Release に zip を載せる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Miharikun-v${{ needs.build.outputs.version }}-win-x64.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Miharikun $GITHUB_REF_NAME" \
              --generate-notes
          fi
