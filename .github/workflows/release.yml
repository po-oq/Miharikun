name: release

# v* タグを push すると、テスト → 配布 zip の作成（Windows・macOS）→ GitHub Release への添付までを行う。
# 手動実行（Actions タブの Run workflow）では zip を artifact に残すだけで、Release は作らない。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'zip に付けるバージョン（例: 0.1.5）'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: バージョンを決める
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "バージョンの形式が不正です: $v" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    # NativeAOT の発行に必要な C++ ビルドツールと Windows SDK は、このランナーに入っている。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: テスト
        run: dotnet test tests/Miharikun.Tests -c Release

      - name: 配布 zip を作る（App は単一ファイル、Hook は NativeAOT）
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ needs.version.outputs.version }}'

      - name: SHA-256 を作る
        shell: pwsh
        working-directory: dist
        run: |
          $zip = 'Miharikun-v${{ needs.version.outputs.version }}-win-x64.zip'
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: Miharikun-v${{ needs.version.outputs.version }}-win-x64
          path: |
            dist/Miharikun-v${{ needs.version.outputs.version }}-win-x64.zip
            dist/Miharikun-v${{ needs.version.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error

  macos:
    needs: version
    # macos-latest は Apple Silicon（arm64）。osx-arm64 の App と、NativeAOT の Hook をここで作る。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: テスト
        run: dotnet test tests/Miharikun.Tests -c Release

      - name: 配布 zip を作る（Miharikun.app・アドホック署名・ditto・SHA-256）
        run: ./scripts/publish-mac.sh '${{ needs.version.outputs.version }}' "$RUNNER_TEMP/mac" --zip

      - uses: actions/upload-artifact@v4
        with:
          name: Miharikun-v${{ needs.version.outputs.version }}-osx-arm64
          path: |
            ${{ runner.temp }}/mac/Miharikun-v${{ needs.version.outputs.version }}-osx-arm64.zip
            ${{ runner.temp }}/mac/Miharikun-v${{ needs.version.outputs.version }}-osx-arm64.zip.sha256
          if-no-files-found: error

  release:
    # タグを push したときだけ、Release を作って zip を添付する。両方の OS の zip が揃ってから。
    if: github.ref_type == 'tag'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Miharikun-v${{ needs.version.outputs.version }}-*
          merge-multiple: true

      # タグを push しただけなら Release を新しく作る。GitHub の画面から（タグと Release を同時に）作った場合は
      # Release が先にあるので、zip を追加する。
      - name: Release に zip と SHA-256 を載せる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l
          files=(Miharikun-v${{ needs.version.outputs.version }}-win-x64.zip{,.sha256} Miharikun-v${{ needs.version.outputs.version }}-osx-arm64.zip{,.sha256})
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Miharikun $GITHUB_REF_NAME" \
              --generate-notes
          fi
